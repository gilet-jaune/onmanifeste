site_name: Awesome Protest
# Injected by CI from the GitHub Pages configuration (no hardcoded host).
site_url: !ENV [SITE_URL, null]
site_description: Outils et ressources utiles pour manifester en France
theme:
  name: material
  language: fr
  custom_dir: overrides
  favicon: assets/icons/icon.svg
  font:
    text: Barlow
    code: Roboto Mono
  logo: assets/icons/icon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.breadcrumbs
    - navigation.footer
    - content.action.edit
    # Hovering a footnote number shows the source and who checked it.
    - content.footnote.tooltips
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: System preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra:
  author:
    name: citron-oppresse
    url: https://github.com/citron-oppresse
  # Footer mascot. Drop the image at docs/assets/footer/ and uncomment.
  # Only use an image you have the right to publish (own drawing, licence or permission).
  # footer_mascot:
  #   src: assets/footer/mascot.webp
  #   alt: mascot
  #   credit: Illustration © Wankil Studio, utilisée avec autorisation
  repositories:
    docs:
      name: &doc_repo_name onmanifeste
      url: &doc_repo_url https://github.com/gilet-jaune/onmanifeste

repo_name: *doc_repo_name
repo_url: *doc_repo_url
edit_uri: edit/main/docs/

plugins:
  # Self-hosts Google Fonts and other external assets at build time: no third-party request from visitors.
  - privacy
  - search:
      lang: [fr, en]
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: Useful tools and resources for protesting in France
          nav_translations:
            Accueil: Home
            Urgence: Emergency
            Trouver de l'aide: Find help
            Avant la manif: Before the protest
            Pendant la manif: During the protest
            Après la manif: After the protest
            Selon votre situation: Depending on your situation
            Mobiliser et informer: Mobilise and inform
            Pourquoi nous rejoindre ?: Why join us?
            Comprendre: Understand
            Voies démocratiques bafouées: Democratic channels flouted
            Le projet: About
            Annuaire: Directory
            Je suis… et je veux…: I am… and I want to…
            Checklist avant la manif: Pre-protest checklist
            Le droit de manifester: The right to protest
            Ce que la loi interdit en manifestation, et ce qu'on risque: What the law forbids at a protest, and what you risk
            ADN, empreintes et photos en garde à vue: DNA, fingerprints and photos in police custody
            Ne jamais rester seul·e: Never stay alone
            Kit et tenue de manif: Protest kit and outfit
            Pancartes, banderoles, drapeaux et tracts: Signs, banners, flags and leaflets
            Parler à la presse en manifestation: Talking to the press at a protest
            Photographier et filmer pour la presse: Photographing and filming for the press
            Venir et repartir: Getting there and back
            Communiquer pendant une manif: Communicating at a protest
            "Téléphone : verrouillage, code et saisie": "Phone: emergency lock, passcode and seizure"
            Premiers secours: First aid
            "Armes de la police : effets, blessures et débris": "Police weapons: effects, injuries and debris"
            "Contrôle d'identité, fouille de sac et amendes": ID checks, bag searches and fines
            Garde à vue: Police custody
            Porter plainte, audition libre et procès: Filing a complaint, voluntary interview and trial
            Choc émotionnel, angoisse et santé mentale: Emotional shock, anxiety and mental health
            Filmer les forces de l'ordre: Film the police
            Dispersion, sommations et nasse: Dispersal, warnings and kettling
            Handicap ou maladie chronique: Disability or chronic condition
            Manifester sans la nationalité française: Protesting without French nationality
            Drapeau palestinien en manifestation: The Palestinian flag at protests
            "Lycéen·nes : blocus, absences, sanctions": "High-school students: blockades, absences, sanctions"
            Violences sexistes et harcèlement en ligne: Sexist violence and online harassment
            Agressions par l'extrême droite: Far-right attacks
            Grève, manif et travail: Strikes, protests and work
            Organiser une manifestation: Organising a protest
            "Groupes Signal : s'organiser en limitant les fuites": "Signal groups: organising while limiting leaks"
            Vue d'ensemble: Overview
            Vous êtes membre: As a member
            Recruter et rencontrer: Recruiting and meeting
            Valider: Vetting
            Créer et régler les groupes: Creating and configuring groups
            Tenir les groupes: Running the groups
            Groupe compromis: Compromised group
            Modèles à copier-coller: Copy-paste templates
            S'informer et se former: Stay informed, get trained
            Vérifier une info et éviter la désinformation: Check a story and avoid disinformation
            "Réseaux sociaux : ne pas nourrir la haine": "Social media: don't feed hate"
            Pourquoi ça casse en manif ?: Why property gets smashed at protests
            Convaincre ses proches: Talk to your loved ones
            Chants de manifestation: Protest songs
            Repères historiques: History
            Répressions documentées: Documented repression
            Blessé·es et mort·es: Injured and killed
            Paramètres: Settings
            Contribuer: Contributing
            Carte de poche: Pocket card
            Fiches mémo à imprimer: Memo sheets to print
            Fiches mémo Signal à imprimer: Signal memo sheets to print
            Mentions légales: Legal notice
  - macros:
      include_dir: .
      # Data registries exposed to pages (JSON is valid YAML): kinds, events, categories, resources…
      include_yaml:
        - docs/data/history.json
        - docs/data/resources.json
        - docs/data/parcours.json
        - docs/data/parcours-signal.json
        - docs/data/sources.json
        - docs/data/victimes.json
        - docs/data/rallier.json
        - docs/data/guide-themes.json
        - docs/data/routes.json
        - docs/data/check-levels.json

extra_css:
  # Self-hosted at build time by the privacy plugin.
  - https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap
  - stylesheets/extra.css

extra_javascript:
  - javascripts/check-levels.js
  - javascripts/extra.js
  - javascripts/directory.js
  - javascripts/pwa.js
  - javascripts/parcours.js
  - javascripts/guides-filter.js

hooks:
  - hooks/sources.py
  - hooks/translations.py
  # Digest of the guides for the guided search (data/guides-digest.json, before pwa.py hashes it).
  - hooks/guide_digest.py
  # "In this situation?" links at the bottom of each guide, from the guided-search data.
  - hooks/related_paths.py
  # Short share links <site>/rejoindre/<profile>/ (before pwa.py hashes the site).
  - hooks/short_links.py
  # Order matters: the CSP is injected before the service worker hashes the final HTML.
  - hooks/qrcode.py
  - hooks/csp.py
  - hooks/pwa.py

