      - Annuaire: annuaire/index.md
  - Guides:
      - guides/index.md
      - Avant la manif:
          - Checklist avant la manif: guides/avant-de-partir.md
          - Le droit de manifester: guides/droit-de-manifester.md
          - Ce que la loi interdit en manifestation, et ce qu'on risque: guides/risques-penaux.md
          - Kit et tenue de manif: guides/kit-manif.md
          - Pancartes, banderoles, drapeaux et tracts: guides/faire-sa-pancarte.md
          - Venir et repartir: guides/venir-repartir.md
          - Communiquer pendant une manif: guides/communiquer.md
          - "Téléphone : verrouillage, code et saisie": guides/telephone.md
          - Ne jamais rester seul·e: guides/ne-pas-rester-seul.md
      - Pendant la manif:
          - Dispersion, sommations et nasse: guides/dispersion.md
          - "Contrôle d'identité, fouille de sac et amendes": guides/controle-fouille.md
          - Premiers secours: guides/premiers-secours.md
          - "Armes de la police : effets, blessures et débris": guides/armes-police.md
          - Filmer les forces de l'ordre: guides/filmer.md
          - Agressions par l'extrême droite: guides/extreme-droite.md
      - Après la manif:
          - Garde à vue: guides/garde-a-vue.md
          - ADN, empreintes et photos en garde à vue: guides/adn-signalisation.md
          - Porter plainte, audition libre et procès: guides/suites-judiciaires.md
          - Choc émotionnel, angoisse et santé mentale: guides/sante-mentale.md
          - Violences sexistes et harcèlement en ligne: guides/violences-harcelement.md
      - Selon votre situation:
          - "Lycéen·nes : blocus, absences, sanctions": guides/lyceens.md
          - Grève, manif et travail: guides/travail.md
          - Manifester sans la nationalité française: guides/etrangers.md
          - Handicap ou maladie chronique: guides/handicap.md
      - Mobiliser et informer:
          - Organiser une manifestation: guides/organiser.md
          - "Groupes Signal : s'organiser en limitant les fuites":
              - Vue d'ensemble: guides/groupes-signal.md
              - Vous êtes membre: guides/signal-membres.md
              - Recruter et rencontrer: guides/signal-recrutement.md
              - Valider: guides/signal-valider.md
              - Créer et régler les groupes: guides/signal-creer.md
              - Tenir les groupes: guides/signal-gerer.md
              - Groupe compromis: guides/signal-groupe-compromis.md
              - Modèles à copier-coller: guides/signal-modeles.md
          - Drapeau palestinien en manifestation: guides/drapeau-palestinien.md
          - "Réseaux sociaux : ne pas nourrir la haine": guides/reseaux-sociaux.md
          - Parler à la presse en manifestation: guides/parler-a-la-presse.md
          - Photographier et filmer pour la presse: guides/photographier-pour-la-presse.md
          - Vérifier une info et éviter la désinformation: guides/desinformation.md
          - Convaincre ses proches: guides/convaincre-ses-proches.md
          - Chants de manifestation: guides/chants.md
          - Pourquoi nous rejoindre ?: rallier/index.md
          - S'informer et se former: guides/s-informer-se-former.md
  - Comprendre:
      - comprendre/index.md
      - Repères historiques: histoire/index.md
      - Voies démocratiques bafouées: confiance/index.md
      - Pourquoi ça casse en manif ?: guides/casse.md
      - Répressions documentées: repressions/index.md
      - Blessé·es et mort·es: victimes/index.md
  - Le projet:
      - Paramètres: parametres.md
      - Contribuer: contribuer/index.md
      - Mentions légales: mentions-legales/index.md

markdown_extensions:
  # Wraps code blocks so Material adds its copy button (content.code.copy).
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - footnotes
  - tables
  # ~~barré~~ (strikethrough); ~ alone stays a literal character
  - pymdownx.tilde:
      subscript: false
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 4
